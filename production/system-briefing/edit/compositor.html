<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>QORGAN System Briefing — compositor</title>
<!--
  Покадровый компоновщик ролика. render.mjs открывает эту страницу в Edge без окна, для каждого кадра вызывает
  renderFrame(k) и делает снимок. Все параметры — в timeline.js (его собирает tools/timeline.mjs из журнала съёмки).
  Здесь ничего не придумывается: картинка — кадры записи настоящего QORGAN, строки датчика — его настоящий вывод.
-->
<style>
  @font-face { font-family: 'Inter Variable'; font-weight: 100 900; src: url('../../../node_modules/@fontsource-variable/inter/files/inter-cyrillic-wght-normal.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Inter Variable'; font-weight: 100 900; src: url('../../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root {
    --bg: #050a12; --ink: #eaf6ff; --ink-2: rgba(214, 234, 248, 0.78); --ink-3: rgba(170, 200, 225, 0.62);
    --line: rgba(120, 200, 255, 0.18); --cyan: #5ee0ff; --green: #65f0a8; --amber: #ffb547; --red: #ff6b6b;
    --font: 'Inter Variable', 'Segoe UI', sans-serif; --mono: 'Cascadia Mono', Consolas, monospace;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  #stage { position: absolute; inset: 0; }
  canvas { position: absolute; inset: 0; }
  .layer { position: absolute; pointer-events: none; }

  /* Метка главы — моноширинная, как навигация Hydro Future */
  #chapter { left: 56px; bottom: 40px; display: flex; gap: 12px; align-items: center; font: 600 22px/1 var(--mono); letter-spacing: .06em;
    color: var(--ink); padding: 12px 18px; border-radius: 12px; background: rgba(5, 10, 18, .72); border: 1px solid var(--line);
    backdrop-filter: blur(10px); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  #chapter .n { color: var(--cyan); }
  #chapter .speed { margin-left: 6px; padding: 4px 10px; border-radius: 8px; font-size: 18px; color: var(--amber); border: 1px solid rgba(255,181,71,.4); background: rgba(255,181,71,.08); }

  /* Постоянная честная пометка */
  #edu { left: 56px; bottom: 40px; font: 600 20px/1 var(--font); color: var(--ink-2); padding: 11px 16px; border-radius: 999px;
    background: rgba(5, 10, 18, .7); border: 1px solid var(--line); backdrop-filter: blur(8px); display: flex; gap: 10px; align-items: center; }
  #edu i { width: 9px; height: 9px; border-radius: 50%; background: var(--amber); display: inline-block; }

  /* Окно Python-датчика: только настоящий вывод sensor.py */
  #term { left: 56px; top: 48px; width: 720px; border-radius: 16px; overflow: hidden; background: rgba(4, 9, 16, .9);
    border: 1px solid rgba(94,224,255,.28); box-shadow: 0 24px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4); backdrop-filter: blur(12px); }
  #term .bar { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); font: 600 20px/1 var(--font); color: var(--ink); }
  #term .bar .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }
  #term .bar .sub { color: var(--ink-3); font-weight: 500; }
  #term pre { margin: 0; padding: 14px 18px 16px; font: 500 21px/1.55 var(--mono); color: var(--ink-2); white-space: pre; min-height: 196px; }
  #term pre .d { color: var(--red); font-weight: 700; }
  #term pre .cmd { color: var(--cyan); font-weight: 700; }
  #term pre .mode { color: var(--amber); }

  /* Нижняя подпись (lower third) */
  #lower { left: 56px; bottom: 104px; padding: 18px 24px; border-radius: 16px; background: rgba(5, 10, 18, .78); border: 1px solid var(--line); backdrop-filter: blur(10px); }
  #lower .t { font: 700 34px/1.1 var(--font); color: var(--ink); letter-spacing: -.01em; }
  #lower .s { margin-top: 8px; font: 500 22px/1.3 var(--font); color: var(--ink-2); }

  /* Финальная карточка */
  #end { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    background: radial-gradient(1200px 600px at 50% 60%, rgba(94,224,255,.10), transparent 70%), var(--bg); }
  #end .mark { color: var(--ink); }
  #end .mark .river { stroke: var(--cyan); filter: drop-shadow(0 0 10px rgba(94,224,255,.7)); }
  #end .word { font: 800 108px/1 var(--font); letter-spacing: .12em; color: var(--ink); margin-left: .12em; }
  #end .tag { font: 500 34px/1.3 var(--font); color: var(--ink-2); }
  #end .small { font: 500 22px/1.3 var(--mono); color: var(--ink-3); letter-spacing: .04em; }
  #end .rule { width: 220px; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); }

  #fade { inset: 0; background: #000; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="chapter" class="layer"><span class="n"></span><span class="l"></span><span class="speed"></span></div>
  <div id="lower" class="layer"><div class="t"></div><div class="s"></div></div>
  <div id="term" class="layer">
    <div class="bar"><span class="dot"></span><span>Python-датчик</span><span class="sub">sensor.py · отдельный процесс · MQTT</span></div>
    <pre></pre>
  </div>
  <div id="edu" class="layer"><i></i><span>Учебная демонстрация · демо-данные</span></div>
  <div id="end" class="layer">
    <svg class="mark" width="150" height="150" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M31.2 27.4A13.5 13.5 0 1 1 33.5 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
      <path class="river" d="M4.5 21.5c3.4-3.1 6.2-3.1 9.6 0s6.2 3.1 9.6 0 5.6-2.8 8.6 1.2l4.6 6.8" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div class="word">QORGAN</div>
    <div class="rule"></div>
    <div class="tag">Мониторинг и раннее предупреждение паводков · р. Есиль</div>
    <div class="small">Учебный прототип · Digital Urpaq 2026</div>
  </div>
  <div id="fade" class="layer"></div>
</div>
<script src="timeline.js"></script>
<script>
const TL = window.TIMELINE;
const FPS = TL.fps;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingQuality = 'high';
const $ = (id) => document.getElementById(id);

// ── математика ─────────────────────────────────────────────────────────────────────────────────────
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, u) => a + (b - a) * u;
const easeInOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const smooth = (u) => u * u * (3 - 2 * u);
/** 0→1→0: плавное появление и исчезновение слоя на отрезке [a, b]. */
const window01 = (t, a, b, fin = 0.35, fout = 0.35) => clamp(Math.min((t - a) / fin, (b - t) / fout), 0, 1);

// ── источник: отрезки монтажа (EDL) ─────────────────────────────────────────────────────────────────
// Отрезок: {take, out: [начало, конец] в ролике, src: [начало, конец] в записи}. Скорость = длина src / длина out.
function srcTime(seg, t) {
  const u = (t - seg.out[0]) / (seg.out[1] - seg.out[0]);
  // Внутри отрезка — кусочно-линейная карта времени (map: [[outT, srcT], ...]) для плавных ускорений.
  if (seg.map) {
    const m = seg.map;
    if (t <= m[0][0]) return m[0][1] + (t - m[0][0]);
    for (let i = 1; i < m.length; i++) if (t <= m[i][0]) return lerp(m[i - 1][1], m[i][1], (t - m[i - 1][0]) / (m[i][0] - m[i - 1][0]));
    return m.at(-1)[1] + (t - m.at(-1)[0]);
  }
  return lerp(seg.src[0], seg.src[1], u);
}
function speedAt(seg, t) {
  if (!seg.map) return (seg.src[1] - seg.src[0]) / (seg.out[1] - seg.out[0]);
  const m = seg.map;
  for (let i = 1; i < m.length; i++) if (t <= m[i][0]) return (m[i][1] - m[i - 1][1]) / (m[i][0] - m[i - 1][0]);
  return 1;
}
function frameFile(take, s) {
  const fr = TL.takes[take].frames; // [[ts, file], ...], ts — секунды от начала записи
  let lo = 0, hi = fr.length - 1;
  if (s <= fr[0][0]) return fr[0][1];
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (fr[mid][0] <= s) lo = mid; else hi = mid - 1; }
  return fr[lo][1];
}

// ── камера отрезка: ключевые кадры {t, x, y, z, ease} в координатах страницы 1920×1080 (t — время ролика) ───────────────────────────
function camera(t, k) {
  if (t <= k[0].t) return k[0];
  for (let i = 1; i < k.length; i++) {
    if (t <= k[i].t) {
      const a = k[i - 1], b = k[i];
      const u = (b.ease === 'cut') ? 1 : (b.ease === 'linear' ? (t - a.t) / (b.t - a.t) : easeInOut((t - a.t) / (b.t - a.t)));
      return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: lerp(a.z, b.z, u) };
    }
  }
  return k.at(-1);
}
function fitCam(c) {
  const hw = 960 / c.z, hh = 540 / c.z;
  return { z: c.z, x: clamp(c.x, hw, 1920 - hw), y: clamp(c.y, hh, 1080 - hh) };
}
const toScreen = (c, p) => ({ x: 960 + (p.x - c.x) * c.z, y: 540 + (p.y - c.y) * c.z });

// ── картинки ────────────────────────────────────────────────────────────────────────────────────────
const cache = new Map();
function getImage(take, file) {
  const key = take + '/' + file;
  let rec = cache.get(key);
  if (!rec) {
    const img = new Image();
    img.src = `../capture/${take}/frames/${file}`;
    rec = { img, ready: img.decode().then(() => img) };
    cache.set(key, rec);
    if (cache.size > 90) cache.delete(cache.keys().next().value);
  }
  return rec.ready;
}

// ── курсор (координаты записи) ──────────────────────────────────────────────────────────────────────
function cursorAt(take, s) {
  const c = TL.takes[take].cursor; // [[ts, x, y], ...]
  if (!c.length) return null;
  if (s <= c[0][0]) return { x: c[0][1], y: c[0][2] };
  let lo = 0, hi = c.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (c[mid][0] <= s) lo = mid; else hi = mid - 1; }
  const a = c[lo], b = c[lo + 1];
  if (!b) return { x: a[1], y: a[2] };
  const u = clamp((s - a[0]) / Math.max(1e-6, b[0] - a[0]), 0, 1);
  return { x: lerp(a[1], b[1], u), y: lerp(a[2], b[2], u) };
}
const CURSOR = new Path2D('M0 0 L0 25 L6.2 19.4 L10.4 29 L14.6 27.2 L10.5 17.8 L18.5 17.6 Z');
function drawCursor(p, scale, alpha, pressed) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(p.x, p.y);
  ctx.scale(scale * (pressed ? 0.9 : 1), scale * (pressed ? 0.9 : 1));
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#ffffff'; ctx.fill(CURSOR);
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 1.6; ctx.strokeStyle = '#0a1622'; ctx.lineJoin = 'round'; ctx.stroke(CURSOR);
  ctx.restore();
}
function drawClick(p, age, scale) {
  // Сдержанная подсветка клика: одно расходящееся кольцо.
  const u = clamp(age / 0.55, 0, 1);
  if (u >= 1) return;
  ctx.save();
  ctx.globalAlpha = (1 - u) * 0.9;
  ctx.strokeStyle = '#5ee0ff'; ctx.lineWidth = 3 * scale;
  ctx.shadowColor = 'rgba(94,224,255,0.8)'; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(p.x, p.y, (10 + 34 * easeInOut(u)) * scale, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ── сцена ───────────────────────────────────────────────────────────────────────────────────────────
async function drawSegment(seg, t, alpha) {
  const take = TL.takes[seg.take];
  const s = srcTime(seg, t);
  const img = await getImage(seg.take, frameFile(seg.take, s));
  const cam = fitCam(camera(t, seg.cam));
  ctx.save();
  ctx.globalAlpha = alpha;
  const dpr = img.naturalWidth / 1920; // кадр записи: 1920×1080 CSS-пикселей × плотность
  // Кадр записи — 1920×1080 CSS-пикселей × dsf. Точка камеры (x, y) — в центр холста.
  ctx.setTransform(cam.z / dpr, 0, 0, cam.z / dpr, 960 - cam.x * cam.z, 540 - cam.y * cam.z);
  ctx.drawImage(img, 0, 0);
  ctx.restore();

  if (seg.cursor && alpha > 0.01) {
    const p = cursorAt(seg.take, s);
    if (p) {
      const sp = toScreen(cam, p);
      const scale = 1.25 + 0.35 * (cam.z - 1);
      let pressed = false;
      for (const c of take.clicks) {
        const age = s - c[0];
        if (age >= 0 && age < 0.6) drawClick(toScreen(cam, { x: c[1], y: c[2] }), age, scale);
        if (age >= -0.02 && age < 0.12) pressed = true;
      }
      const fade = seg.cursorFade ? window01(t, seg.cursorFade[0], seg.cursorFade[1], 0.4, 0.4) : 1;
      drawCursor(sp, scale, alpha * fade, pressed);
    }
  }
  return s;
}

function setLayer(el, opacity, dy = 0) {
  el.style.opacity = opacity.toFixed(3);
  el.style.transform = `translateY(${(dy * (1 - opacity)).toFixed(1)}px)`;
  el.style.visibility = opacity > 0.002 ? 'visible' : 'hidden';
}

function sensorText(take, s, maxLines) {
  const lines = TL.takes[take].sensor.filter((l) => l[0] <= s).map((l) => l[1]);
  return lines.slice(-maxLines);
}
const esc = (x) => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function fmtSensor(line) {
  if (line.startsWith('> ')) return `<span class="cmd">${esc(line)}</span>`;
  let h = esc(line);
  h = h.replace(/(DANGER)/, '<span class="d">$1</span>').replace(/(режим → [A-Z]+)/, '<span class="mode">$1</span>');
  return h;
}

window.renderFrame = async function renderFrame(k) {
  const t = k / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#050a12';
  ctx.fillRect(0, 0, 1920, 1080);

  // Отрезки, видимые в момент t (с учётом перекрёстных переходов).
  let mainSeg = null, mainS = 0;
  for (const seg of TL.segments) {
    const xin = seg.xin ?? 0;
    if (t < seg.out[0] - xin || t >= seg.out[1]) continue;
    const a = t < seg.out[0] ? smooth((t - (seg.out[0] - xin)) / xin) : 1;
    const s = await drawSegment(seg, t, a);
    if (a >= 0.5 || !mainSeg) { mainSeg = seg; mainS = s; }
  }

  // Глава и ускорение
  const ch = TL.chapters.find((c) => t >= c.t[0] && t < c.t[1]);
  const chEl = $('chapter');
  if (ch) {
    chEl.querySelector('.n').textContent = ch.n;
    chEl.querySelector('.l').textContent = ch.label;
    const sp = mainSeg ? speedAt(mainSeg, t) : 1;
    const spEl = chEl.querySelector('.speed');
    spEl.style.display = sp > 1.15 ? 'inline-block' : 'none';
    spEl.textContent = `ускорено ×${sp.toFixed(1).replace('.', ',')}`;
    setLayer(chEl, window01(t, ch.t[0], ch.t[1], 0.45, 0.45), 10);
  } else setLayer(chEl, 0);

  // Подпись
  const lo = TL.lowers.find((l) => t >= l.t[0] && t < l.t[1]);
  if (lo) {
    $('lower').querySelector('.t').textContent = lo.title;
    $('lower').querySelector('.s').textContent = lo.sub;
    setLayer($('lower'), window01(t, lo.t[0], lo.t[1], 0.5, 0.5), 16);
  } else setLayer($('lower'), 0);

  // Окно датчика
  const term = TL.terminal;
  if (mainSeg && t >= term.t[0] - 0.6 && t < term.t[1] + 0.6) {
    const lines = sensorText(term.take, mainS, 7);
    $('term').querySelector('pre').innerHTML = lines.map(fmtSensor).join('\n');
    setLayer($('term'), window01(t, term.t[0], term.t[1], 0.5, 0.5), 24);
  } else setLayer($('term'), 0);

  // Пометка стоит справа от метки главы (внизу слева), чтобы не закрывать всплывающие уведомления интерфейса справа.
  const chW = chEl.style.visibility === 'visible' ? chEl.offsetWidth * smooth(parseFloat(chEl.style.opacity)) : 0;
  $('edu').style.left = (56 + (chW ? chW + 14 : 0)).toFixed(1) + 'px';
  setLayer($('edu'), window01(t, TL.edu[0], TL.edu[1], 0.6, 0.6));
  setLayer($('end'), window01(t, TL.end[0], TL.end[1] + 5, 0.9, 0.5));
  const ec = clamp((t - TL.end[0]) / 1.6, 0, 1);
  $('end').style.transform = `scale(${(0.97 + 0.03 * easeInOut(ec)).toFixed(4)})`;
  // Затемнение в начале и в конце
  const f = Math.max(1 - clamp(t / TL.fadeIn, 0, 1), clamp((t - (TL.duration - TL.fadeOut)) / TL.fadeOut, 0, 1));
  $('fade').style.opacity = f.toFixed(3);
  await document.fonts.ready;
  await new Promise((r) => requestAnimationFrame(() => r()));
  return true;
};
window.compositorReady = true;
</script>
</body>
</html>
